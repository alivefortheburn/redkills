<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>brand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Enter Screen -->
  <div id="enter-screen">
    <span id="enter-btn">enter</span>
  </div>

  <!-- Logo intro (fades in, then out) -->
  <div id="logo-screen">
    <img src="assets/images/mainlogo.png" alt="logo">
  </div>

  <!-- Persistent header logo -->
  <header id="site-header">
    <img src="assets/images/mainlogo.png" alt="logo">
  </header>

  <!-- Background audio -->
  <audio id="bg-music" src="assets/music/drunk.mp3" loop></audio>

  <!-- Gallery (single column) -->
  <div id="gallery">
    <img class="gallery-item" src="assets/images/jerseyfront.png" alt="jersey">
  </div>

  <!-- Detail view -->
  <div id="detail-view">
    <span id="back-btn">back</span>
    <div id="detail-photos">
      <img class="detail-photo" src="assets/images/jerseyfront.png" alt="jersey front">
      <img class="detail-photo" src="assets/images/jerseyback.png" alt="jersey back">
    </div>
    <div id="detail-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
    <p id="detail-description">
      placeholder line one goes here<br>
      placeholder line two goes here<br>
      placeholder line three goes here
    </p>
  </div>

  <!-- Zoom lightbox -->
  <div id="lightbox">
    <img id="lightbox-img" src="" alt="zoomed shirt">
  </div>

  <script src="js/main.js"></script>
</body>
</html>
