<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>brand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Enter Screen -->
  <div id="enter-screen">
    <span id="enter-btn">enter</span>
  </div>

  <!-- Logo intro (fades in, then out) -->
  <div id="logo-screen">
    <img src="assets/images/mainlogo.png" alt="logo">
  </div>

  <!-- Persistent header logo -->
  <header id="site-header">
    <img src="assets/images/mainlogo.png" alt="logo">
  </header>

  <!-- Background audio -->
  <audio id="bg-music" src="assets/music/drunk.mp3" loop></audio>

  <!-- Gallery (single column) -->
  <div id="gallery">
    <img class="gallery-item" src="assets/images/jerseyfront.png" alt="jersey" data-detail="detail-jersey">
    <img class="gallery-item" src="assets/images/longfront.png" alt="long" data-detail="detail-long">
  </div>

  <!-- Detail view: jersey -->
  <div class="detail-view" id="detail-jersey">
    <span class="back-btn">back</span>
    <div class="detail-photos">
      <img class="detail-photo" src="assets/images/jerseyfront.png" alt="jersey front">
      <img class="detail-photo" src="assets/images/jerseyback.png" alt="jersey back">
    </div>
    <div class="detail-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
    <p class="detail-description">
     soccer jersey<br>
     raglan sleeve contrast stitch<br>
      240 gsm 100% cotton dtg print
    </p>
  </div>

  <!-- Detail view: long -->
  <div class="detail-view" id="detail-long">
    <span class="back-btn">back</span>
    <div class="detail-photos">
      <img class="detail-photo" src="assets/images/longfront.png" alt="long front">
      <img class="detail-photo" src="assets/images/longback.png" alt="long back">
    </div>
    <div class="detail-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
    <p class="detail-description">
      distressed long sleeve<br>
      vintage wash paint splatter<br>
      270 gsm 100% cotton dtg print
    </p>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
